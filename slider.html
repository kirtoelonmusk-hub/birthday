 <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>بخش بانمک | مخصوص یگانه</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --blue-dark: #061428;
      --blue-mid: #0a2342;
      --blue-light: #1e3a5f;
      --blue-glow: #4facfe;
      --blue-cyan: #00f2fe;
      --blue-soft: #7fc4ff;
      --blue-pale: #b8e0ff;
      --glass-bg: rgba(30, 58, 95, 0.3);
      --glass-border: rgba(79, 172, 254, 0.4);
      --text-light: #e8f4ff;
      --text-soft: #b8d8f0;
    }

    body {
      min-height: 100vh;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(79, 172, 254, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(0, 242, 254, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 40% 80%, rgba(30, 58, 95, 0.3) 0%, transparent 60%),
        linear-gradient(135deg, #061428, #0a2342, #0d1f3d, #061428);
      background-size: 200% 200%, 200% 200%, 200% 200%, auto;
      animation: bgMove 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Vazirmatn', 'Segoe UI', 'Tahoma', sans-serif;
      position: relative;
      padding: 20px;
      overflow-x: hidden;
    }

    @keyframes bgMove {
      0%, 100% { background-position: 0% 0%, 0% 0%, 0% 0%; }
      50% { background-position: 100% 100%, 100% 100%, 100% 100%; }
    }

    .noise {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      background: repeating-radial-gradient(circle at 20% 30%, rgba(79, 172, 254, 0.04) 0px, rgba(79, 172, 254, 0.04) 2px, transparent 2px, transparent 6px);
      opacity: 0.5;
      mix-blend-mode: overlay;
      z-index: 1;
    }

    .particle {
      position: fixed;
      background: radial-gradient(circle, rgba(79, 172, 254, 0.7), transparent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
    }

    .slides-container {
      width: 90%;
      max-width: 480px;
      position: relative;
      z-index: 10;
    }

    .slide {
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      border-radius: 50px 35px 50px 35px;
      padding: 2.2rem 1.6rem;
      text-align: center;
      border: 1px solid var(--glass-border);
      box-shadow: 
        0 25px 45px rgba(0, 0, 0, 0.4),
        0 0 30px rgba(79, 172, 254, 0.2);
      animation: slideIn 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h2 {
      font-size: 1.7rem;
      font-family: 'Dancing Script', cursive;
      background: linear-gradient(125deg, #b8e0ff, #4facfe, #00f2fe);
      background-size: 300% auto;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 25px;
      animation: titleShine 4s linear infinite;
      font-weight: 700;
    }

    @keyframes titleShine {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* دکمه */
    .cherry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 32px;
      background: linear-gradient(135deg, #1e3a5f, #4facfe);
      background-size: 200% auto;
      color: white;
      border: none;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin: 8px 5px;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(79, 172, 254, 0.35);
      position: relative;
      overflow: hidden;
      font-family: 'Vazirmatn', sans-serif;
    }

    .cherry-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    .cherry-btn:hover::before { left: 100%; }
    .cherry-btn:active { transform: scale(0.95); }

    /* پیام قفل شده */
    .locked-message {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 20px;
      padding: 25px;
      margin: 15px 0;
      cursor: pointer;
      transition: all 0.4s;
      color: var(--text-light);
      font-size: 1rem;
      border: 1px solid rgba(79, 172, 254, 0.3);
      font-weight: 500;
    }
    .locked-message.locked { filter: blur(6px); background: #0a1f38; }
    .locked-message.unlocked { 
      filter: blur(0); 
      background: linear-gradient(135deg, rgba(79, 172, 254, 0.25), rgba(0, 242, 254, 0.15));
      border-color: rgba(79, 172, 254, 0.6);
      box-shadow: 0 0 25px rgba(79, 172, 254, 0.3);
    }

    /* کپسول زمان */
    .time-textarea {
      width: 90%;
      padding: 14px;
      border-radius: 20px;
      background: rgba(232, 244, 255, 0.95);
      border: 2px solid rgba(79, 172, 254, 0.4);
      margin: 15px 0;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 0.9rem;
      color: #061428;
      resize: none;
      outline: none;
      transition: all 0.3s;
    }
    .time-textarea:focus {
      border-color: var(--blue-glow);
      box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
    }
    .time-textarea::placeholder {
      color: #5a7a9a;
    }

    /* ========== کد تخفیف شیک ========== */
    .code-box {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 25px;
      margin: 20px 0;
      padding: 3px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(79, 172, 254, 0.3);
    }

    .code-box::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, #4facfe, transparent, #00f2fe, transparent);
      animation: rotateBorder 4s linear infinite;
      z-index: 1;
    }

    @keyframes rotateBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .code-inner {
      background: linear-gradient(135deg, #0a2342, #1e3a5f);
      border-radius: 22px;
      padding: 25px 20px;
      position: relative;
      z-index: 2;
    }

    .code-label {
      font-size: 0.75rem;
      color: var(--blue-soft);
      letter-spacing: 3px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .code {
      font-size: 2rem;
      color: white;
      font-weight: 800;
      letter-spacing: 5px;
      text-shadow: 
        0 0 10px rgba(79, 172, 254, 0.8),
        0 0 20px rgba(79, 172, 254, 0.5);
      margin: 8px 0;
      font-family: 'Dancing Script', cursive;
      animation: codePulse 2s ease-in-out infinite;
    }

    @keyframes codePulse {
      0%, 100% { text-shadow: 0 0 10px rgba(79, 172, 254, 0.8), 0 0 20px rgba(79, 172, 254, 0.5); }
      50% { text-shadow: 0 0 15px rgba(79, 172, 254, 1), 0 0 30px rgba(79, 172, 254, 0.7), 0 0 40px rgba(0, 242, 254, 0.4); }
    }

    .code-desc {
      color: var(--blue-pale);
      font-size: 0.85rem;
      margin-top: 10px;
    }

    /* تبریک پایانی */
    .congrats-text {
      font-size: 1.2rem;
      margin: 18px 0;
      color: var(--blue-pale);
      font-family: 'Dancing Script', cursive;
    }
    .princess-line {
      font-size: 1.1rem;
      color: var(--blue-soft);
      margin: 12px 0;
    }
    .hearts-row {
      font-size: 2rem;
      margin: 25px 0;
      letter-spacing: 15px;
      animation: heartsFloat 3s ease-in-out infinite;
    }

    @keyframes heartsFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .restart-btn {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #061428;
      margin-top: 15px;
      box-shadow: 0 5px 20px rgba(79, 172, 254, 0.5);
    }

    .theme-toggle {
      position: fixed;
      top: 15px;
      left: 15px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e3a5f, #4facfe);
      border: none;
      cursor: pointer;
      font-size: 1.4rem;
      z-index: 1000;
      box-shadow: 0 3px 15px rgba(79, 172, 254, 0.5);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .theme-toggle:active { transform: scale(0.9); }

    body.light-theme {
      background: linear-gradient(145deg, #e8f4ff, #d0e8ff, #b8dcff);
    }
    body.light-theme .slide {
      background: rgba(255, 255, 255, 0.5);
      box-shadow: 0 25px 45px rgba(79, 172, 254, 0.15), 0 0 30px rgba(79, 172, 254, 0.2);
    }
    body.light-theme .locked-message {
      background: rgba(79, 172, 254, 0.1);
      color: #061428;
    }
    body.light-theme .locked-message.locked {
      background: rgba(79, 172, 254, 0.15);
    }
    body.light-theme .princess-line,
    body.light-theme .congrats-text {
      color: #0a2342;
    }

    @media (max-width: 550px) {
      .slide { padding: 1.6rem 1.2rem; border-radius: 45px 30px 45px 30px; }
      h2 { font-size: 1.4rem; }
      .cherry-btn { padding: 10px 24px; font-size: 0.85rem; }
      .code { font-size: 1.7rem; letter-spacing: 4px; }
      .hearts-row { font-size: 1.6rem; letter-spacing: 10px; }
      .congrats-text { font-size: 1rem; }
      .princess-line { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

<div class="noise"></div>
<button class="theme-toggle" id="themeToggleBtn">🌙</button>

<div class="slides-container" id="slidesContainer">

  <!-- اسلاید 1: پیام قفل شده -->
  <div class="slide" id="slide1">
    <h2>پیام قفل شده</h2>
    <div class="locked-message locked" id="lockedMsg" onclick="unlockMessage()">برای خوندن پیام کلیک کن</div>
    <div id="secretMsg" style="display: none; background: linear-gradient(135deg, rgba(79, 172, 254, 0.3), rgba(0, 242, 254, 0.2)); padding: 18px; border-radius: 20px; margin-top: 12px; color: var(--text-light); border: 1px solid rgba(79, 172, 254, 0.5); font-size: 0.95rem; line-height: 1.8;">
      یگانه جان... تو بهترین اتفاق زندگی منی!<br>
      دوستت دارم بی‌نهایت
    </div>
    <button class="cherry-btn" onclick="nextSlide()">بعدی</button>
  </div>

  <!-- اسلاید 2: کپسول زمان -->
  <div class="slide" id="slide2" style="display: none;">
    <h2>کپسول زمان</h2>
    <textarea id="timeCapsule" rows="3" class="time-textarea" placeholder="برای ۲۰ سالگیت یه آرزو بنویس..."></textarea>
    <button class="cherry-btn" onclick="saveTimeCapsule()">ذخیره</button>
    <button class="cherry-btn" onclick="nextSlide()">بعدی</button>
  </div>

  <!-- اسلاید 3: کد تخفیف شیک -->
  <div class="slide" id="slide3" style="display: none;">
    <h2>کد تخفیف</h2>
    <div class="code-box">
      <div class="code-inner">
        <div class="code-label">PROMO CODE</div>
        <div class="code">YEGANE75</div>
        <div class="code-desc">۷۵٪ تخفیف برای بغل کردن من</div>
      </div>
    </div>
    <button class="cherry-btn" onclick="copyCode()">کپی کن</button>
    <button class="cherry-btn" onclick="nextSlide()">بعدی</button>
  </div>

  <!-- اسلاید 4: تبریک پایانی -->
  <div class="slide" id="slide4" style="display: none;">
    <h2>تبریک</h2>
    <p class="congrats-text">تو همه چالش‌ها رو پشت سر گذاشتی!</p>
    <p class="princess-line">تو بهترین پرنسس دنیایی</p>
    <div class="hearts-row">❤️ 💙 🤍</div>
    <button class="cherry-btn" onclick="sendToTelegram()">ارسال جواب‌ها برای سام</button>
    <button class="cherry-btn restart-btn" onclick="goToStart()">برگشت به صفحه اول</button>
  </div>

</div>

<script>
  // ========== ذرات آبی ==========
  function createParticle() {
    const p = document.createElement('div');
    p.classList.add('particle');
    const size = Math.random() * 7 + 3;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (Math.random() * 10 + 6) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 16000);
  }
  setInterval(createParticle, 200);
  for (let i = 0; i < 40; i++) setTimeout(createParticle, i * 80);

  // ========== اسلایدر ==========
  let currentSlide = 1;
  const totalSlides = 4;

  function showSlide(n) {
    for (let i = 1; i <= totalSlides; i++) {
      const slide = document.getElementById(`slide${i}`);
      if (slide) slide.style.display = 'none';
    }
    const current = document.getElementById(`slide${n}`);
    if (current) current.style.display = 'block';
    currentSlide = n;
  }

  function nextSlide() {
    if (currentSlide < totalSlides) {
      showSlide(currentSlide + 1);
    } else {
      showSlide(1);
    }
  }

  // ========== پیام قفل شده ==========
  function unlockMessage() {
    const locked = document.getElementById('lockedMsg');
    const secret = document.getElementById('secretMsg');
    locked.classList.remove('locked');
    locked.classList.add('unlocked');
    locked.innerHTML = 'پیام باز شد';
    secret.style.display = 'block';
  }

  // ========== کپسول زمان ==========
  function saveTimeCapsule() {
    const msg = document.getElementById('timeCapsule').value;
    if (msg) alert('آرزویت در کپسول زمان ذخیره شد');
    else alert('یه آرزوی قشنگ بنویس');
  }

  // ========== کپی کد ==========
  function copyCode() {
    navigator.clipboard.writeText('YEGANE75');
    alert('کد تخفیف کپی شد');
  }

  // ========== ارسال به تلگرام ==========
  function sendToTelegram() {
    const msg = `جواب‌های تولد یگانه\nکپسول زمان: ${document.getElementById('timeCapsule')?.value || 'ندارد'}\nمخصوص سام`;
    window.open(`https://t.me/share/url?url=${encodeURIComponent(msg)}&text=${encodeURIComponent(msg)}`, '_blank');
  }

  // ========== برگشت ==========
  function goToStart() {
    window.location.href = 'index.html';
  }

  // ========== دکمه تغییر تم ==========
  const themeToggle = document.getElementById('themeToggleBtn');
  let isDark = true;
  themeToggle.addEventListener('click', () => {
    if (isDark) {
      document.body.classList.add('light-theme');
      themeToggle.innerHTML = '☀️';
      isDark = false;
    } else {
      document.body.classList.remove('light-theme');
      themeToggle.innerHTML = '🌙';
      isDark = true;
    }
  });

  showSlide(1);
</script>
</body>
</html>
